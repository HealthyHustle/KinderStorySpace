<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#93C5FD"/>
      <stop offset="60%" stop-color="#E0F2FE"/>
      <stop offset="100%" stop-color="#FED7AA"/>
    </linearGradient>
    <linearGradient id="seaGrad4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <linearGradient id="sandGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="shadow4" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0B2447" flood-opacity="0.16"/>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="800" height="290" fill="url(#skyGrad4)"/>

  <!-- Warm Afternoon Sunlight -->
  <g transform="translate(110, 80)">
    <circle cx="0" cy="0" r="50" fill="#FDE047" opacity="0.25"/>
    <circle cx="0" cy="0" r="32" fill="#FBBF24" opacity="0.9"/>
  </g>

  <!-- Soft Clouds -->
  <path d="M260,65 Q290,45 320,60 Q345,45 370,60 Q390,55 405,70 L280,70 Z" fill="#FFFFFF" opacity="0.8"/>
  <path d="M560,85 Q585,70 610,80 Q630,70 655,85 L580,85 Z" fill="#FFFFFF" opacity="0.75"/>

  <!-- Calm Coastal Sea -->
  <rect y="210" width="800" height="150" fill="url(#seaGrad4)"/>
  <path d="M0,230 Q200,218 400,230 Q600,242 800,230 L800,260 L0,260 Z" fill="#38BDF8" opacity="0.35"/>

  <!-- Grand Ship Anchored in Background -->
  <g transform="translate(140, 140)" filter="url(#shadow4)" opacity="0.9">
    <path d="M-80,45 Q0,75 80,45 L70,85 Q0,100 -65,85 Z" fill="#78350F"/>
    <line x1="0" y1="-50" x2="0" y2="50" stroke="#451A03" stroke-width="5"/>
    <path d="M5,-45 Q50,-15 5,20 Z" fill="#FFFFFF" opacity="0.9"/>
    <polygon points="0,-50 20,-42 0,-34" fill="#F59E0B"/>
  </g>

  <!-- Sandy Shore / Pantai Tempat Pertemuan -->
  <path d="M0,270 Q300,240 550,280 Q700,305 800,280 L800,500 L0,500 Z" fill="url(#sandGrad4)"/>
  <path d="M0,310 Q320,280 570,320 Q710,345 800,320 L800,500 L0,500 Z" fill="#FEF08A" opacity="0.5"/>

  <!-- Palm Tree & Coastal Foliage on Right -->
  <g transform="translate(740, 160)">
    <path d="M-10,180 Q-25,90 0,20 Q-8,90 -2,180 Z" fill="#78350F"/>
    <path d="M0,20 Q-50,0 -70,25" stroke="#15803D" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M0,20 Q-30,-25 -20,-50" stroke="#16A34A" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M0,20 Q25,-30 45,-40" stroke="#22C55E" stroke-width="7" fill="none" stroke-linecap="round"/>
  </g>

  <!-- THE ENCOUNTER: MOTHER AND MALIN AT THE SHORE -->
  <g transform="translate(400, 240)">
    
    <!-- MOTHER (MANDE RUBAYAH) - WALKING FORWARD WITH LONGING & LOVE -->
    <g transform="translate(-140, 20)">
      <!-- Simple humble batik skirt -->
      <path d="M-18,65 L18,65 L24,130 L-24,130 Z" fill="#92400E"/>
      <line x1="-14" y1="88" x2="18" y2="88" stroke="#FDE68A" stroke-width="1.2"/>
      <line x1="-18" y1="110" x2="20" y2="110" stroke="#FDE68A" stroke-width="1.2"/>
      
      <!-- Humble brown/terracotta kebaya -->
      <rect x="-20" y="24" width="40" height="46" rx="8" fill="#C2410C"/>
      
      <!-- Faded yellow soft veil (kerudung sederhana) -->
      <path d="M-18,10 Q0,-4 18,10 L22,48 Q0,54 -22,48 Z" fill="#FDE68A"/>
      
      <!-- Elderly face: Silver hair streaks, gentle loving eyes with tears of joy -->
      <circle cx="0" cy="14" r="16" fill="#FCD34D"/>
      <!-- Soft silver wisps of hair -->
      <path d="M-12,5 Q-4,1 0,5 Q4,1 12,5" stroke="#94A3B8" stroke-width="2" fill="none"/>
      
      <!-- Tender Loving Eyes looking at Malin -->
      <path d="M-6,11 Q-3,7 0,11" stroke="#451A03" stroke-width="2.2" fill="none" stroke-linecap="round"/>
      <path d="M2,11 Q5,7 8,11" stroke="#451A03" stroke-width="2.2" fill="none" stroke-linecap="round"/>
      <!-- Tear of longing & happiness -->
      <circle cx="9" cy="16" r="2" fill="#38BDF8"/>
      <!-- Quivering gentle smile -->
      <path d="M-5,19 Q0,24 5,19" stroke="#451A03" stroke-width="2" fill="none" stroke-linecap="round"/>
      <circle cx="-9" cy="17" r="3" fill="#FCA5A5" opacity="0.5"/>
      <circle cx="9" cy="17" r="3" fill="#FCA5A5" opacity="0.5"/>

      <!-- Arms carrying the small woven basket of Malin's childhood favourite cake -->
      <path d="M14,35 Q30,45 42,48" stroke="#C2410C" stroke-width="6.5" fill="none" stroke-linecap="round"/>
      <circle cx="42" cy="48" r="4.5" fill="#FCD34D"/>

      <!-- WOVEN SNACK BASKET (KERANJANG KUE KAMPUNG) -->
      <g transform="translate(48, 48)" filter="url(#shadow4)">
        <path d="M-12,0 L12,0 L9,14 L-9,14 Z" fill="#B45309" stroke="#78350F" stroke-width="1.5"/>
        <path d="M-10,0 Q0,-12 10,0" stroke="#78350F" stroke-width="2" fill="none"/>
        <!-- Banana leaf wrapping inside -->
        <circle cx="0" cy="-2" r="6" fill="#65A30D"/>
      </g>

      <!-- Mother's Speech Prompt Tag -->
      <g transform="translate(0, -25)">
        <rect x="-60" y="-12" width="120" height="24" rx="12" fill="#FFFFFF" stroke="#EA580C" stroke-width="1.5" filter="url(#shadow4)"/>
        <text x="0" y="4" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#9A3412" text-anchor="middle">❤️ IBU MANDE</text>
      </g>
    </g>

    <!-- MALIN (HESITANT, THOUGHTFUL, OVERWHELMED BY EMOTION) -->
    <g transform="translate(100, 5)">
      <!-- Emerald fine trousers -->
      <rect x="-18" y="72" width="17" height="55" rx="5" fill="#047857"/>
      <rect x="1" y="72" width="17" height="55" rx="5" fill="#047857"/>
      <!-- Leather shoes -->
      <ellipse cx="-9" cy="130" rx="10" ry="5" fill="#78350F"/>
      <ellipse cx="10" cy="130" rx="10" ry="5" fill="#78350F"/>

      <!-- Emerald Merchant Coat with Gold Sash -->
      <rect x="-26" y="24" width="52" height="54" rx="12" fill="#059669"/>
      <path d="M-26,48 Q0,54 26,48 L22,64 Q0,70 -22,64 Z" fill="#F59E0B" stroke="#B45309" stroke-width="1.5"/>

      <!-- Malin's Head: Slightly tilted, blushing with shame and mixed feelings -->
      <circle cx="0" cy="8" r="18" fill="#FCD34D"/>
      <!-- Merchant Destar Headwear -->
      <path d="M-19,6 Q0,-15 19,6 Q16,-10 0,-13 Q-16,-10 -19,6 Z" fill="#D97706"/>
      <polygon points="-6,-10 0,-20 6,-10" fill="#FBBF24"/>

      <!-- Hesitant, deeply thoughtful eyes looking at Mother -->
      <circle cx="-6" cy="7" r="2.5" fill="#0F172A"/>
      <circle cx="4" cy="7" r="2.5" fill="#0F172A"/>
      <!-- Shy/awkward mouth line - hesitating to speak -->
      <line x1="-4" y1="15" x2="4" y2="15" stroke="#0F172A" stroke-width="2.5" stroke-linecap="round"/>
      <!-- Blushing cheeks (Merasa malu & bimbang) -->
      <circle cx="-10" cy="12" r="5" fill="#F87171" opacity="0.75"/>
      <circle cx="10" cy="12" r="5" fill="#F87171" opacity="0.75"/>

      <!-- Clenched hands held close to chest - internal struggle of empathy -->
      <path d="M-22,35 Q-10,48 -4,42" stroke="#059669" stroke-width="7" fill="none" stroke-linecap="round"/>
      <path d="M22,35 Q10,48 4,42" stroke="#059669" stroke-width="7" fill="none" stroke-linecap="round"/>
      <circle cx="0" cy="43" r="5" fill="#FCD34D"/>

      <!-- Malin's Thought Tag -->
      <g transform="translate(0, -40)">
        <rect x="-50" y="-12" width="100" height="24" rx="12" fill="#FFFFFF" stroke="#059669" stroke-width="1.5" filter="url(#shadow4)"/>
        <text x="0" y="4" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#065F46" text-anchor="middle">🧠 MALIN</text>
      </g>
    </g>

    <!-- Social-Emotional Bridge: Heart Motif with Question Sparkle -->
    <g transform="translate(-18, 55)" filter="url(#shadow4)">
      <circle cx="0" cy="0" r="18" fill="#FEE2E2" stroke="#EF4444" stroke-width="2"/>
      <text x="0" y="6" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" text-anchor="middle">💭</text>
    </g>
  </g>
</svg>
