<!DOCTYPE html>

  <link rel="icon" type="image/jpeg" href="assets/logo_kinder_story_space.jpeg">

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
