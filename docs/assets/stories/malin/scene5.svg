<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F472B6"/>
      <stop offset="40%" stop-color="#FBBF24"/>
      <stop offset="80%" stop-color="#FED7AA"/>
      <stop offset="100%" stop-color="#FEF08A"/>
    </linearGradient>
    <linearGradient id="seaGrad5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="40%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>
    <linearGradient id="sandGrad5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FED7AA"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="shadow5" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#78350F" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Glowing Sunset Sky -->
  <rect width="800" height="300" fill="url(#skyGrad5)"/>

  <!-- Big Warm Sun Sinking Gently into the Ocean -->
  <g transform="translate(400, 205)">
    <circle cx="0" cy="0" r="70" fill="#FBBF24" opacity="0.35"/>
    <circle cx="0" cy="0" r="50" fill="#F59E0B" opacity="0.75"/>
    <circle cx="0" cy="0" r="38" fill="#FDE047"/>
  </g>

  <!-- Golden Sunbeams Across the Water -->
  <rect y="200" width="800" height="150" fill="url(#seaGrad5)"/>
  <polygon points="340,200 460,200 520,330 280,330" fill="#FDE047" opacity="0.35"/>

  <!-- Peaceful Distant Islands & Sailing Boats -->
  <path d="M60,200 Q120,180 180,200 Z" fill="#9A3412" opacity="0.5"/>
  <path d="M620,200 Q700,175 780,200 Z" fill="#9A3412" opacity="0.5"/>

  <!-- Small Boat Sailing Towards Family Harbour -->
  <g transform="translate(620, 185)" opacity="0.85">
    <path d="M-25,12 Q0,22 25,12 L20,22 Q0,28 -20,22 Z" fill="#78350F"/>
    <line x1="0" y1="-18" x2="0" y2="15" stroke="#451A03" stroke-width="2"/>
    <path d="M2,-15 Q18,-4 2,8 Z" fill="#FFFFFF"/>
  </g>

  <!-- Sandy Shore / Pantai Sunset -->
  <path d="M0,285 Q380,250 800,290 L800,500 L0,500 Z" fill="url(#sandGrad5)"/>
  <path d="M0,320 Q390,285 800,325 L800,500 L0,500 Z" fill="#FED7AA" opacity="0.6"/>

  <!-- Sparkles & Warm Golden Stars -->
  <g fill="#FDE047">
    <circle cx="160" cy="110" r="3"/>
    <circle cx="280" cy="80" r="4"/>
    <circle cx="560" cy="95" r="3.5"/>
    <circle cx="680" cy="125" r="4"/>
  </g>

  <!-- RECONCILIATION & FAMILY WARMTH: MALIN AND MOTHER EMBRACING -->
  <g transform="translate(400, 245)" filter="url(#shadow5)">
    <!-- Golden Aura of Family Love -->
    <ellipse cx="0" cy="70" rx="90" ry="80" fill="#FEF3C7" opacity="0.45"/>

    <!-- Floating Loving Hearts -->
    <g transform="translate(0, -10)">
      <path d="M-6,-18 A6,6 0 0,0 -18,-18 Q-18,-7 -6,0 Q6,-7 6,-18 A6,6 0 0,0 -6,-18 Z" fill="#EF4444" transform="scale(0.8) translate(0, -10)"/>
      <path d="M-28,15 A5,5 0 0,0 -38,15 Q-38,24 -28,30 Q-18,24 -18,15 A5,5 0 0,0 -28,15 Z" fill="#F43F5E" transform="scale(0.7) translate(-10, 0)"/>
      <path d="M28,15 A5,5 0 0,0 18,15 Q18,24 28,30 Q38,24 38,15 A5,5 0 0,0 28,15 Z" fill="#F43F5E" transform="scale(0.7) translate(10, 0)"/>
    </g>

    <!-- MOTHER (LEFT) & MALIN (RIGHT) IN A WARM EMBRACE -->
    
    <!-- MOTHER'S BODY -->
    <g transform="translate(-25, 10)">
      <!-- Long Skirt -->
      <path d="M-22,65 L15,65 L18,135 L-26,135 Z" fill="#92400E"/>
      <!-- Kebaya -->
      <rect x="-24" y="24" width="40" height="48" rx="8" fill="#EA580C"/>
      <!-- Kerudung Kuning Lembut -->
      <path d="M-20,8 Q-4,-6 14,8 L18,48 Q-4,54 -24,48 Z" fill="#FDE047"/>
      <!-- Face & Sweet Closed Joyful Eyes -->
      <circle cx="-3" cy="14" r="16" fill="#FCD34D"/>
      <!-- Eyes: curved lines showing joyful relief (smiling closed eyes) -->
      <path d="M-9,13 Q-6,9 -3,13" stroke="#451A03" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <path d="M-1,13 Q2,9 5,13" stroke="#451A03" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <path d="M-6,21 Q-1,26 4,21" stroke="#451A03" stroke-width="2.2" fill="none" stroke-linecap="round"/>
      <circle cx="-10" cy="19" r="3.5" fill="#F87171" opacity="0.6"/>
      <circle cx="6" cy="19" r="3.5" fill="#F87171" opacity="0.6"/>

      <!-- Mother's Arm Wrapping Tenderly Around Malin -->
      <path d="M-10,38 Q15,42 35,46" stroke="#EA580C" stroke-width="8" fill="none" stroke-linecap="round"/>
      <circle cx="35" cy="46" r="5" fill="#FCD34D"/>
    </g>

    <!-- MALIN'S BODY (EMBRACING & APOLOGIZING SINCERELY) -->
    <g transform="translate(25, 12)">
      <!-- Pants -->
      <rect x="-14" y="65" width="28" height="68" rx="5" fill="#047857"/>
      <!-- Merchant Tunic -->
      <rect x="-18" y="24" width="42" height="48" rx="8" fill="#059669"/>
      <!-- Sash -->
      <rect x="-18" y="48" width="42" height="8" fill="#F59E0B"/>

      <!-- Malin's Head leaning close to Mother -->
      <circle cx="3" cy="14" r="16" fill="#FCD34D"/>
      <!-- Hair & Destar -->
      <path d="M-12,8 Q2,-12 18,8 Z" fill="#D97706"/>
      <polygon points="4,-8 10,-18 16,-8" fill="#FBBF24"/>
      <!-- Peaceful Joyful Closed Eyes with Tear of Relief -->
      <path d="M-2,13 Q1,9 4,13" stroke="#0F172A" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <path d="M6,13 Q9,9 12,13" stroke="#0F172A" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <circle cx="1" cy="17" r="1.8" fill="#38BDF8"/>
      <!-- Warm Relieved Smile -->
      <path d="M1,21 Q6,26 11,21" stroke="#0F172A" stroke-width="2.2" fill="none" stroke-linecap="round"/>
      <circle cx="-1" cy="19" r="3" fill="#F87171" opacity="0.6"/>
      <circle cx="12" cy="19" r="3" fill="#F87171" opacity="0.6"/>

      <!-- Malin's Arm Hugging Mother -->
      <path d="M12,38 Q-12,42 -30,46" stroke="#059669" stroke-width="8" fill="none" stroke-linecap="round"/>
      <circle cx="-30" cy="46" r="5" fill="#FCD34D"/>
    </g>

    <!-- Happy Ribbon/Banner Above -->
    <g transform="translate(0, 160)">
      <rect x="-110" y="-15" width="220" height="30" rx="15" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2" filter="url(#shadow5)"/>
      <text x="0" y="6" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#92400E" text-anchor="middle">✨ KELUARGA SELALU DI HATI ✨</text>
    </g>
  </g>
</svg>
