<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="60%" stop-color="#BAE6FD"/>
      <stop offset="100%" stop-color="#FEF9C3"/>
    </linearGradient>
    <linearGradient id="seaGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="shadow3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0B2447" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="800" height="280" fill="url(#skyGrad3)"/>

  <!-- Bustling Distant Port Skyline & Mountains -->
  <path d="M0,210 Q90,165 190,210 Q280,180 390,210 Q500,160 620,210 Q710,185 800,210 L800,240 L0,240 Z" fill="#93C5FD" opacity="0.6"/>
  <path d="M120,210 L120,185 L135,185 L135,210" fill="#60A5FA" opacity="0.5"/>
  <path d="M540,210 L540,175 L565,175 L565,210" fill="#60A5FA" opacity="0.5"/>

  <!-- Sea -->
  <rect y="210" width="800" height="150" fill="url(#seaGrad3)"/>
  <path d="M0,230 Q200,215 400,230 Q600,245 800,230 L800,260 L0,260 Z" fill="#38BDF8" opacity="0.4"/>

  <!-- INTERACTIVE OBJECT 1: KAPAL BESAR (GRAND MERCHANT SHIP) -->
  <g id="scene3-obj-kapal" transform="translate(180, 110)" filter="url(#shadow3)" style="cursor: pointer;">
    <!-- Large Stately Hull with Gold Trim -->
    <path d="M-150,90 Q0,150 170,90 L145,170 Q0,210 -120,170 Z" fill="#78350F"/>
    <path d="M-135,90 L155,90 L135,125 L-110,125 Z" fill="#B45309"/>
    <!-- Gold Trim Line -->
    <path d="M-130,125 Q0,165 130,125" stroke="#FBBF24" stroke-width="4" fill="none"/>
    <!-- Ornate Carved Bow Figurehead (Swan/Bird of Wisdom) -->
    <path d="M165,85 Q190,65 180,50 Q168,60 155,75" stroke="#F59E0B" stroke-width="6" fill="none" stroke-linecap="round"/>

    <!-- Portholes with Brass Rings -->
    <g fill="#FEF08A" stroke="#F59E0B" stroke-width="2">
      <circle cx="-70" cy="140" r="7"/>
      <circle cx="-25" cy="145" r="7"/>
      <circle cx="20" cy="145" r="7"/>
      <circle cx="65" cy="140" r="7"/>
      <circle cx="105" cy="135" r="7"/>
    </g>

    <!-- Three Tall Masts -->
    <line x1="-70" y1="-85" x2="-70" y2="95" stroke="#451A03" stroke-width="8" stroke-linecap="round"/>
    <line x1="20" y1="-105" x2="20" y2="95" stroke="#451A03" stroke-width="9" stroke-linecap="round"/>
    <line x1="100" y1="-75" x2="100" y2="95" stroke="#451A03" stroke-width="7" stroke-linecap="round"/>

    <!-- Grand White & Cream Sails Billowing Proudly -->
    <path d="M-65,-80 Q10,-35 -65,35 Z" fill="#FFFFFF" opacity="0.95" filter="url(#shadow3)"/>
    <path d="M25,-100 Q115,-45 25,45 Z" fill="#FFFFFF" opacity="0.98" filter="url(#shadow3)"/>
    <path d="M105,-70 Q165,-25 105,40 Z" fill="#FFFFFF" opacity="0.95" filter="url(#shadow3)"/>

    <!-- Rigging Lines -->
    <line x1="-70" y1="-85" x2="-140" y2="95" stroke="#D1D5DB" stroke-width="1.5" stroke-dasharray="3,2"/>
    <line x1="20" y1="-105" x2="-60" y2="95" stroke="#D1D5DB" stroke-width="1.5" stroke-dasharray="3,2"/>
    <line x1="20" y1="-105" x2="100" y2="95" stroke="#D1D5DB" stroke-width="1.5" stroke-dasharray="3,2"/>

    <!-- Proud Golden Merchant Flags -->
    <polygon points="20,-105 60,-92 20,-79" fill="url(#goldGrad)"/>
    <polygon points="-70,-85 -40,-74 -70,-63" fill="#EF4444"/>

    <!-- Interactive Hint Tag -->
    <g transform="translate(15, -125)">
      <rect x="-56" y="-14" width="112" height="28" rx="14" fill="#FFFFFF" stroke="#1687F8" stroke-width="2" filter="url(#shadow3)"/>
      <text x="0" y="5" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" font-weight="800" fill="#0B2447" text-anchor="middle">🚢 KAPAL BESAR</text>
    </g>
  </g>

  <!-- BUSY STONE & TIMBER TRADING DOCK -->
  <g transform="translate(0, 320)">
    <polygon points="340,10 800,10 800,180 340,180" fill="#475569"/>
    <!-- Stone Paving Texture -->
    <polygon points="340,10 800,10 800,45 340,45" fill="#64748B"/>
    <line x1="390" y1="10" x2="390" y2="45" stroke="#334155" stroke-width="2"/>
    <line x1="480" y1="10" x2="480" y2="45" stroke="#334155" stroke-width="2"/>
    <line x1="570" y1="10" x2="570" y2="45" stroke="#334155" stroke-width="2"/>
    <line x1="670" y1="10" x2="670" y2="45" stroke="#334155" stroke-width="2"/>
    <line x1="750" y1="10" x2="750" y2="45" stroke="#334155" stroke-width="2"/>

    <!-- Piling & Dock Edge -->
    <rect x="340" y="45" width="460" height="15" fill="#334155"/>
  </g>

  <!-- INTERACTIVE OBJECT 2: BARANG DAGANGAN (CHESTS, SPICES, FABRICS) -->
  <g id="scene3-obj-dagangan" transform="translate(420, 310)" filter="url(#shadow3)" style="cursor: pointer;">
    <!-- Wooden Chest of Spices & Gold -->
    <g transform="translate(0, 35)">
      <!-- Chest Base -->
      <rect x="-26" y="0" width="52" height="34" rx="4" fill="#B45309" stroke="#78350F" stroke-width="2"/>
      <rect x="-28" y="-8" width="56" height="12" rx="4" fill="#D97706" stroke="#78350F" stroke-width="2"/>
      <!-- Gold Clasps & Lock -->
      <rect x="-22" y="0" width="6" height="34" fill="#FBBF24"/>
      <rect x="16" y="0" width="6" height="34" fill="#FBBF24"/>
      <rect x="-5" y="-2" width="10" height="12" rx="2" fill="#F59E0B" stroke="#B45309" stroke-width="1.5"/>
      <circle cx="0" cy="4" r="2" fill="#451A03"/>
    </g>

    <!-- Sacks of Cloves & Nutmeg (Rempah-Rempah Nusantara) -->
    <g transform="translate(-45, 45)">
      <path d="M-18,22 C-22,0 -12,-15 0,-15 C12,-15 22,0 18,22 Z" fill="#D97706"/>
      <circle cx="0" cy="-14" r="4" fill="#92400E"/>
      <!-- Stitch markings -->
      <line x1="-5" y1="0" x2="5" y2="0" stroke="#78350F" stroke-width="2"/>
      <line x1="-5" y1="8" x2="5" y2="8" stroke="#78350F" stroke-width="2"/>
    </g>

    <!-- Rolls of Luxurious Songket Fabric / Kain Indah -->
    <g transform="translate(48, 52)">
      <rect x="-14" y="-12" width="28" height="16" rx="6" fill="#059669" stroke="#047857" stroke-width="1.5"/>
      <rect x="-12" y="2" width="28" height="15" rx="6" fill="#DC2626" stroke="#B91C1C" stroke-width="1.5"/>
      <ellipse cx="14" cy="-4" rx="4" ry="7" fill="#10B981"/>
      <ellipse cx="16" cy="10" rx="4" ry="7" fill="#EF4444"/>
    </g>

    <!-- Interactive Hint Tag -->
    <g transform="translate(0, -5)">
      <rect x="-65" y="-14" width="130" height="28" rx="14" fill="#FEF3C7" stroke="#D97706" stroke-width="2" filter="url(#shadow3)"/>
      <text x="0" y="5" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" font-weight="800" fill="#92400E" text-anchor="middle">💰 BARANG DAGANGAN</text>
    </g>
  </g>

  <!-- INTERACTIVE OBJECT 3: PAKAIAN MALIN & ADULT SUCCESSFUL MALIN -->
  <g id="scene3-obj-pakaian" transform="translate(640, 220)" filter="url(#shadow3)" style="cursor: pointer;">
    <!-- Elegant Silk Trousers -->
    <rect x="-18" y="70" width="17" height="55" rx="5" fill="#047857"/>
    <rect x="1" y="70" width="17" height="55" rx="5" fill="#047857"/>
    <!-- Elegant Golden Leather Shoes -->
    <ellipse cx="-9" cy="128" rx="11" ry="5.5" fill="#D97706" stroke="#92400E" stroke-width="1.5"/>
    <ellipse cx="10" cy="128" rx="11" ry="5.5" fill="#D97706" stroke="#92400E" stroke-width="1.5"/>

    <!-- Emerald Merchant Coat / Baju Saudagar Zamrud -->
    <rect x="-26" y="22" width="52" height="54" rx="12" fill="#059669"/>
    <!-- Golden Embroidery on Collar -->
    <path d="M-10,22 L0,40 L10,22" stroke="#FBBF24" stroke-width="3" fill="none"/>

    <!-- Golden Silk Sash / Selendang Emas Berwibawa -->
    <path d="M-26,48 Q0,54 26,48 L22,64 Q0,70 -22,64 Z" fill="url(#goldGrad)" stroke="#B45309" stroke-width="1.5"/>
    <path d="M12,58 L18,88 L26,86 L20,56 Z" fill="url(#goldGrad)"/>

    <!-- Head & Successful Expression -->
    <circle cx="0" cy="5" r="18" fill="#FCD34D"/>
    <!-- Traditional Merchant Headwear (Destar Minang / Tengkuluk Emas) -->
    <path d="M-19,3 Q0,-18 19,3 Q16,-12 0,-15 Q-16,-12 -19,3 Z" fill="#D97706"/>
    <polygon points="-8,-12 0,-24 8,-12" fill="#FBBF24"/>
    <circle cx="0" cy="-12" r="3" fill="#DC2626"/>

    <!-- Face: Confident yet thoughtful eyes -->
    <circle cx="-5" cy="5" r="2.5" fill="#0F172A"/>
    <circle cx="5" cy="5" r="2.5" fill="#0F172A"/>
    <path d="M-5,12 Q0,17 5,12" stroke="#0F172A" stroke-width="2" fill="none" stroke-linecap="round"/>
    <circle cx="-10" cy="10" r="3" fill="#F87171" opacity="0.5"/>
    <circle cx="10" cy="10" r="3" fill="#F87171" opacity="0.5"/>

    <!-- Arms: Proud, holding a golden token -->
    <path d="M-25,32 Q-38,45 -28,60" stroke="#059669" stroke-width="8" fill="none" stroke-linecap="round"/>
    <circle cx="-28" cy="60" r="6" fill="#FCD34D"/>
    <path d="M25,32 Q38,45 28,60" stroke="#059669" stroke-width="8" fill="none" stroke-linecap="round"/>
    <circle cx="28" cy="60" r="6" fill="#FCD34D"/>

    <!-- Interactive Hint Tag -->
    <g transform="translate(0, -42)">
      <rect x="-56" y="-14" width="112" height="28" rx="14" fill="#FFFFFF" stroke="#059669" stroke-width="2" filter="url(#shadow3)"/>
      <text x="0" y="5" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" font-weight="800" fill="#0B2447" text-anchor="middle">👕 PAKAIAN MALIN</text>
    </g>
  </g>
</svg>
